# Blocker-only overlay adapted from Herdr's Apache-2.0 OpenCode manifest.
schema_version = 1
provider = "opencode"
version = "2026.08.11.1"

[[blockers]]
id = "permission_required"
confidence = "high"
priority = 1000
region = { kind = "bottom_lines", lines = 16 }
contains_all = ["Permission required"]

[[blockers]]
id = "interactive_prompt"
confidence = "high"
priority = 900
region = { kind = "bottom_lines", lines = 12 }
contains_all = ["esc dismiss"]
contains_any = ["enter confirm", "enter submit", "enter toggle"]
