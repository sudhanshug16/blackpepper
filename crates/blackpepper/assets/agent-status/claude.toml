# Blocker-only overlay adapted from Herdr's Apache-2.0 Claude manifest.
schema_version = 1
provider = "claude"
version = "2026.08.11.1"

[[blockers]]
id = "live_selection_form"
confidence = "high"
priority = 1000
region = { kind = "bottom_lines", lines = 14 }
contains_all = ["Esc to cancel"]
contains_any = ["Enter to confirm", "Enter to select"]

[[blockers]]
id = "dynamic_workflow"
confidence = "high"
priority = 950
region = { kind = "bottom_lines", lines = 14 }
contains_all = ["Run a dynamic workflow?", "Esc to cancel"]

[[blockers]]
id = "permission_prompt"
confidence = "high"
priority = 900
region = { kind = "bottom_lines", lines = 18 }
contains_all = ["Do you want to proceed?"]
contains_any = ["Yes", "No", "Tab to amend", "Ctrl+E to explain"]

[[blockers]]
id = "connection_prompt"
confidence = "medium"
priority = 850
region = { kind = "bottom_lines", lines = 12 }
contains_all = ["Do you want to allow this connection?"]
