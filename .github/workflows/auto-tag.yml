name: Auto Tag Release

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  tag:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect version bump
        id: version
        run: |
          write_output() {
            printf '%s\n' "$@" >> "$GITHUB_OUTPUT"
          }
          if ! git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -q "^crates/blackpepper/Cargo.toml$"; then
            write_output "changed=false"
            exit 0
          fi
          VERSION=$(sed -nE 's/^version\s*=\s*"([^"]+)".*/\1/p' crates/blackpepper/Cargo.toml | head -n1)
          if [ -z "$VERSION" ]; then
            write_output "changed=false"
            exit 0
          fi
          TAG="v$VERSION"
          if git tag -l "$TAG" | grep -q "$TAG"; then
            write_output "changed=false"
            exit 0
          fi
          write_output "changed=true" "version=$VERSION" "tag=$TAG"
      - name: Create tag
        if: steps.version.outputs.changed == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"
