name: Auto Tag Release

on:
  push:
    branches: ["main"]

permissions:
  contents: write

concurrency:
  group: auto-tag-main
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  tag:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect unreleased version
        id: version
        run: |
          write_output() {
            printf '%s\n' "$@" >> "$GITHUB_OUTPUT"
          }
          VERSION=$(sed -nE 's/^version\s*=\s*"([^"]+)".*/\1/p' crates/blackpepper/Cargo.toml | head -n1)
          if [ -z "$VERSION" ]; then
            write_output "changed=false"
            exit 0
          fi
          TAG="v$VERSION"
          if git tag -l "$TAG" | grep -q "$TAG"; then
            write_output "changed=false"
            exit 0
          fi
          write_output "changed=true" "version=$VERSION" "tag=$TAG"
      - name: Create tag
        if: steps.version.outputs.changed == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git fetch origin main --tags

          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            echo "$TAG was created while quality checks were running."
            exit 0
          fi
          if [ "$(git rev-parse refs/remotes/origin/main)" != "$GITHUB_SHA" ]; then
            echo "A newer main commit exists; its quality run owns tagging."
            exit 0
          fi

          if git push --atomic \
            --force-with-lease="refs/heads/main:$GITHUB_SHA" \
            origin \
            "$GITHUB_SHA:refs/heads/main" \
            "$GITHUB_SHA:refs/tags/$TAG"; then
            remote_main=$(git ls-remote origin refs/heads/main | awk '{print $1}')
            if [ "$remote_main" = "$GITHUB_SHA" ]; then
              exit 0
            fi

            echo "A newer main commit landed while $TAG was created; removing the stale tag."
            git push \
              --force-with-lease="refs/tags/$TAG:$GITHUB_SHA" \
              origin \
              ":refs/tags/$TAG"
            exit 0
          fi

          remote_main=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          remote_tag=$(git ls-remote origin "refs/tags/$TAG" | awk '{print $1}')
          if [ "$remote_tag" = "$GITHUB_SHA" ]; then
            if [ "$remote_main" = "$GITHUB_SHA" ]; then
              echo "$TAG was created concurrently at this commit."
              exit 0
            fi
            echo "$TAG reached the server before a lost reply, but main advanced; removing the stale tag."
            git push \
              --force-with-lease="refs/tags/$TAG:$GITHUB_SHA" \
              origin \
              ":refs/tags/$TAG"
            exit 0
          fi
          if [ -z "$remote_tag" ] && [ "$remote_main" != "$GITHUB_SHA" ]; then
            echo "A newer main commit won the race; its quality run owns tagging."
            exit 0
          fi
          echo "Could not safely create $TAG at $GITHUB_SHA." >&2
          exit 1
