# Every accepted license is permissive or file-level copyleft and is present in
# the pinned Zellij workspace graph. `cargo about --fail` rejects anything else.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MPL-2.0",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "curl",
    "LicenseRef-AWS-LC-Notice",
]

# Cover the four distributed native binaries and their embedded WASM plugins.
targets = [
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "wasm32-wasip1",
]
ignore-build-dependencies = false
ignore-dev-dependencies = true
ignore-transitive-dependencies = false

# These packages need cargo-about's checksum-backed license clarifications.
workarounds = ["rustix", "wasmtime"]

[unicode-ident]
accepted = ["Unicode-DFS-2016"]

# cargo-about normally sees only the Rust wrapper licenses for `-sys` crates.
# These checksum-backed clarifications also carry the notices for native source
# that the locked build compiles into the distributed executable.
[curl-sys.clarify]
license = "MIT AND curl"

[[curl-sys.clarify.files]]
path = "LICENSE"
license = "MIT"
checksum = "f96def8cba2793fb8582fd12ca6d4dc0ef4ee239e8c3f80e809ec43648da6199"

